<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA — качество диалогов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__title"><img class="topbar__logo" src="img/doom.svg" alt="CQA" width="30" height="30"></div>
    <button type="button" id="nav-toggle" class="burger" aria-label="Меню" aria-expanded="false" aria-controls="nav"><span class="burger__bars" aria-hidden="true"></span></button>
    <nav id="nav" class="nav" aria-label="Разделы"></nav>
  </header>
  <main id="view-dialogs" class="layout">
    <aside id="list-pane" class="pane" aria-label="Список диалогов"></aside>
    <section id="center-pane" class="pane" aria-label="Диалог"></section>
    <section id="result-pane" class="pane" aria-label="Результат оценки"></section>
  </main>
  <main id="view-review" class="review" hidden>
    <aside id="appeals-list-pane" class="pane" aria-label="Список апелляций"></aside>
    <section id="appeal-card-pane" class="pane" aria-label="Карточка апелляции"></section>
  </main>
  <main id="view-checklist" class="page" hidden aria-label="Редактор чек-листа"></main>
  <footer class="footer">
    <span class="footer__lead">Союзники проекта</span>
    <ul class="footer__allies" aria-label="Союзники проекта">
      <li>Freedom</li><li>Data Sci</li><li>NU Impact Foundation</li><li>ADSI</li>
    </ul>
    <span class="footer__motto">Doomsday · Data Challenge</span>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
